<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demanda Uber - Buenos Aires</title>
    <style>
        :root { --bg-dark:#0f172a; --card-bg:#1e293b; --card-border:#334155; --text-main:#f8fafc; --text-muted:#94a3b8; --accent-red:#ef4444; --accent-blue:#38bdf8; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        body { background:var(--bg-dark); color:var(--text-main); padding:16px; max-width:600px; margin:0 auto; padding-bottom:50px; }
        header { text-align:center; margin-bottom:16px; padding:16px; background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 100%); border:1px solid var(--card-border); border-radius:16px; }
        header h1 { font-size:1.3rem; font-weight:800; }
        .status-bar { background:var(--card-bg); padding:10px 14px; border-radius:12px; font-size:.8rem; color:var(--text-muted); margin-bottom:12px; border:1px solid var(--card-border); display:flex; justify-content:space-between; gap:8px; }
        .aviso { background:rgba(245,158,11,.15); border:1px solid #f59e0b; color:#fbbf24; padding:10px 14px; border-radius:12px; font-size:.82rem; margin-bottom:12px; }
        .filtros { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
        .filtros button { background:var(--card-bg); color:var(--text-muted); border:1px solid var(--card-border); border-radius:999px; padding:6px 12px; font-size:.8rem; }
        .filtros button.on { background:var(--accent-blue); color:#001018; border-color:var(--accent-blue); font-weight:700; }
        .section-title { font-size:1.05rem; font-weight:700; margin:20px 0 12px; }
        .title-events { color:var(--accent-red); } .title-airports { color:var(--accent-blue); }
        .card { background:var(--card-bg); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--card-border); position:relative; }
        .badge { position:absolute; top:16px; right:16px; padding:4px 8px; border-radius:6px; font-size:.7rem; font-weight:700; border:1px solid; }
        .imp-Crítica { background:rgba(239,68,68,.2); color:#f87171; border-color:#ef4444; }
        .imp-Alta { background:rgba(249,115,22,.2); color:#fb923c; border-color:#f97316; }
        .imp-Media { background:rgba(234,179,8,.18); color:#facc15; border-color:#eab308; }
        .imp-Baja { background:rgba(148,163,184,.18); color:#cbd5e1; border-color:#64748b; }
        .card h3 { font-size:1.08rem; margin-bottom:10px; padding-right:70px; }
        .info-row { font-size:.9rem; color:var(--text-muted); margin-bottom:6px; }
        .info-row b { color:var(--text-main); }
        .fuente { font-size:.75rem; color:var(--text-muted); margin-top:8px; }
        .fuente a { color:var(--accent-blue); }
        .nav-buttons { display:flex; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--card-border); }
        .btn-nav { flex:1; display:flex; align-items:center; justify-content:center; padding:10px; border-radius:10px; text-decoration:none; font-weight:600; font-size:.85rem; }
        .btn-maps { background:#fff; color:#1e293b; } .btn-waze { background:#33ccff; color:#000; }
        .vacio { color:var(--text-muted); text-align:center; padding:20px 0; }
    </style>
</head>
<body>
    <header><h1>🚗 Demanda BA</h1></header>
    <div class="status-bar"><span id="fecha-hoy"></span><span id="actualizado">Cargando…</span></div>
    <div id="avisos"></div>

    <div class="section-title title-events">📌 Eventos programados</div>
    <div class="filtros" id="filtros"></div>
    <div id="lista-eventos"><p class="vacio">Cargando eventos…</p></div>

    <div class="section-title title-airports">✈️ Aeropuertos</div>
    <div class="card">
        <span class="badge imp-Baja">Estimado</span>
        <h3>Ezeiza (EZE)</h3>
        <div class="info-row">🕒 <b>Picos típicos:</b> 06:00–09:00 y 18:00–21:00 hs</div>
        <div class="fuente">Referencia general, no es dato en tiempo real de vuelos.</div>
        <div class="nav-buttons">
            <a class="btn-nav btn-maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Aeropuerto+Internacional+Ezeiza">Maps</a>
            <a class="btn-nav btn-waze" target="_blank" rel="noopener" href="https://waze.com/ul?q=Aeropuerto+Internacional+Ezeiza&navigate=yes">Waze</a>
        </div>
    </div>

    <script>
        // Los datos vienen de sitios externos: se escapan antes de mostrarlos.
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const ICONO = { futbol:'⚽', recital:'🎤', teatro:'🎭', otro:'📍' };
        const NOMBRE_TIPO = { todos:'Todos', futbol:'Fútbol', recital:'Recitales', teatro:'Teatros' };
        let DATOS = [], filtro = 'todos';

        function etiquetaDia(iso) {
            const hoy = new Date(); hoy.setHours(0,0,0,0);
            const d = new Date(iso + 'T00:00:00');
            const dif = Math.round((d - hoy) / 86400000);
            const txt = d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
            return dif === 0 ? 'Hoy · ' + txt : dif === 1 ? 'Mañana · ' + txt : txt;
        }

        function tarjeta(ev) {
            const dir = ev.direccion ? ev.lugar + ', ' + ev.direccion : ev.lugar;
            const q = encodeURIComponent(dir + ', Buenos Aires');
            const titulo = ev.local ? `${esc(ev.local)} <span style="color:var(--text-muted)">vs</span> ${esc(ev.visitante)}` : esc(ev.titulo);
            const url = /^https?:\/\//.test(ev.url || '') ? ev.url : '';
            return `
            <div class="card">
                <span class="badge imp-${esc(ev.importancia)}">${esc(ev.importancia)}</span>
                <h3>${ICONO[ev.tipo] || '📍'} ${titulo}</h3>
                ${ev.artista && ev.artista !== ev.titulo ? `<div class="info-row">🎵 <b>Artista:</b> ${esc(ev.artista)}</div>` : ''}
                <div class="info-row">🕒 <b>Inicio:</b> ${ev.hora ? esc(ev.hora) + ' hs' : 'hora a confirmar'}${ev.salida_estimada ? ` · <b>Salida estimada:</b> ${esc(ev.salida_estimada)} hs` : ''}</div>
                <div class="info-row">📍 <b>${esc(ev.lugar)}</b>${ev.direccion ? ' — ' + esc(ev.direccion) : ''}</div>
                ${ev.capacidad ? `<div class="info-row">👥 <b>Capacidad aprox.:</b> ${Number(ev.capacidad).toLocaleString('es-AR')}</div>` : ''}
                ${ev.aviso ? `<div class="info-row" style="color:#fbbf24">⚠️ ${esc(ev.aviso)}</div>` : ''}
                <div class="fuente">Fuente: ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(ev.fuente)}</a>` : esc(ev.fuente)}${ev.coincidencias > 1 ? ` · confirmado por ${Number(ev.coincidencias)} fuentes` : ''}</div>
                <div class="nav-buttons">
                    <a class="btn-nav btn-maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Maps</a>
                    <a class="btn-nav btn-waze" target="_blank" rel="noopener" href="https://waze.com/ul?q=${q}&navigate=yes">Waze</a>
                </div>
            </div>`;
        }

        function pintar() {
            const lista = DATOS.filter(e => filtro === 'todos' || e.tipo === filtro);
            const cont = document.getElementById('lista-eventos');
            if (!lista.length) { cont.innerHTML = '<p class="vacio">No hay eventos confirmados para este filtro.</p>'; return; }
            let html = '', dia = '';
            for (const ev of lista) {
                if (ev.fecha !== dia) { dia = ev.fecha; html += `<div class="section-title" style="margin-top:18px;font-size:.95rem;color:var(--text-main)">${esc(etiquetaDia(dia))}</div>`; }
                html += tarjeta(ev);
            }
            cont.innerHTML = html;
        }

        function pintarFiltros() {
            const tipos = ['todos', ...new Set(DATOS.map(e => e.tipo))];
            document.getElementById('filtros').innerHTML = tipos.map(t =>
                `<button class="${t === filtro ? 'on' : ''}" data-t="${esc(t)}">${esc(NOMBRE_TIPO[t] || t)}</button>`).join('');
            document.querySelectorAll('#filtros button').forEach(b => b.onclick = () => { filtro = b.dataset.t; pintarFiltros(); pintar(); });
        }

        async function cargar() {
            document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-AR', { weekday:'short', day:'numeric', month:'short' });
            try {
                const r = await fetch('eventos.json?t=' + Date.now());
                const j = await r.json();
                DATOS = j.eventos || [];
                const av = [];
                if (j.actualizado) {
                    const horas = (Date.now() - new Date(j.actualizado)) / 3600000;
                    document.getElementById('actualizado').textContent = 'Actualizado ' + new Date(j.actualizado).toLocaleString('es-AR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
                    if (horas > 12) av.push('Los datos tienen más de 12 horas. Revisá que el actualizador automático esté corriendo.');
                } else document.getElementById('actualizado').textContent = 'Sin actualizar';
                if (j.aviso) av.push(j.aviso);
                const caidas = Object.entries(j.fuentes || {}).filter(([, s]) => !s.ok).map(([n]) => n);
                if (caidas.length) av.push('Fuentes sin datos: ' + caidas.join(', ') + '. Puede faltar información.');
                document.getElementById('avisos').innerHTML = av.map(a => `<div class="aviso">⚠️ ${esc(a)}</div>`).join('');
                pintarFiltros(); pintar();
            } catch (e) {
                document.getElementById('lista-eventos').innerHTML = '<p class="vacio" style="color:#ef4444">No se pudo leer eventos.json.</p>';
            }
        }
        cargar();
    </script>
</body>
</html>
