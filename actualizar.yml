name: Actualizar eventos

on:
  schedule:
    - cron: "0 */3 * * *"     # cada 3 horas (hora UTC)
  workflow_dispatch:           # botón "Run workflow" para probar a mano

permissions:
  contents: write

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python actualizar.py -v
      - name: Guardar eventos.json si cambió
        run: |
          git config user.name "bot-eventos"
          git config user.email "bot-eventos@users.noreply.github.com"
          git add eventos.json
          git diff --cached --quiet || (git commit -m "Actualiza eventos" && git push)