name: Actualizar Demanda Diaria

on:
  schedule:
    - cron: '0 7 * * *' # Corre todos los días a las 07:00 UTC (4:00 AM hora Argentina)
  workflow_dispatch: # Permite correrlo a mano cuando quieras desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar Script de Actualización
        run: python actualizar.py

      - name: Guardar cambios automáticamente en GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Actualización automática de eventos diarios"
          branch: main